:root{--paper:#EDEFF1;--ink:#06070B;--acc:#FF5A1F;--mute:#8A8F98;--line:#06070B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#07080C;--ink:#EDEFF1;--mute:#6C717A;--line:#EDEFF1}}
:root[data-theme="dark"]{--paper:#07080C;--ink:#EDEFF1;--mute:#6C717A;--line:#EDEFF1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Anton","Impact","Arial Narrow",sans-serif;overflow-x:hidden;min-height:100vh;position:relative;--w:0%}
.jp{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800}
.slash{position:fixed;inset:0;background:var(--acc);clip-path:polygon(calc(100% - var(--w)) 0,100% 0,100% 100%,calc(100% - var(--w) - 22%) 100%);transition:clip-path .6s;z-index:0}
.bgword{position:fixed;left:-2vw;bottom:-4vw;font-size:34vw;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--mute);opacity:.35;z-index:0;pointer-events:none;letter-spacing:-.01em;transform:rotate(-4deg);white-space:nowrap}
.vert{position:fixed;left:14px;top:90px;writing-mode:vertical-rl;font-size:15px;letter-spacing:.35em;z-index:2}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 20px 60px 46px}
h1{font-weight:400;line-height:.82;font-size:clamp(64px,15vw,176px);text-transform:uppercase;letter-spacing:-.01em}
h1 span{display:block;font-size:.34em;letter-spacing:.06em;margin-top:.12em;background:var(--ink);color:var(--paper);padding:.1em .35em;width:max-content;transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;margin-top:30px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding-left:40px}}
.count{font-size:clamp(56px,11vw,128px);line-height:.9;font-variant-numeric:tabular-nums}
.sub{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:15px;margin:6px 0 18px}
.machine{position:relative;width:min(340px,100%);aspect-ratio:3/4.1;border:6px solid var(--line);background:var(--paper);transform:rotate(-2.5deg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:14px 14px 0 var(--ink)}
.machine.shake{animation:sh .25s}
@keyframes sh{25%{transform:rotate(-4deg) translateX(-5px)}75%{transform:rotate(-1deg) translateX(5px)}}
.win{flex:1;border:4px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:clamp(26px,6.5vw,40px);line-height:.95;text-transform:uppercase;position:relative;overflow:hidden}
.win::before{content:"";position:absolute;width:150%;height:34%;background:var(--acc);transform:rotate(-12deg);z-index:0}
.win b{position:relative;z-index:1;font-weight:400;mix-blend-mode:normal;color:var(--ink)}
.coin{font:inherit;font-size:30px;text-transform:uppercase;border:0;background:var(--ink);color:var(--paper);padding:14px;cursor:pointer;letter-spacing:.04em;touch-action:manipulation;user-select:none}
.coin:active{transform:translateY(3px)}
.coin:focus-visible,.item:focus-visible,.gold:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
.slot{height:16px;background:var(--ink);margin-top:-2px}
.meter{margin-top:34px;max-width:340px}
.meter .top{display:flex;justify-content:space-between;font-size:22px;text-transform:uppercase}
.bar{height:18px;border:3px solid var(--line);margin-top:6px;position:relative;background:var(--paper)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);width:0;transition:width .4s}
.log{margin-top:16px;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:14px;max-width:340px;min-height:2.6em}
.shop{display:flex;flex-direction:column}
.item{font:inherit;text-align:left;background:transparent;color:var(--ink);border:0;border-top:3px solid var(--line);padding:12px 4px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.item:last-child{border-bottom:3px solid var(--line)}
.item .n{font-size:clamp(26px,4.6vw,38px);text-transform:uppercase;line-height:1}
.item .o{font-size:clamp(34px,6vw,52px);line-height:.9;text-align:right;color:var(--mute)}
.item .d{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:13px;grid-column:1}
.item .c{font-size:18px;grid-column:2;text-align:right}
.item.can{background:var(--ink);color:var(--paper)}
.item.can .o{color:var(--acc)}
.item:not(.can){opacity:.55}
.item.curse .n::after{content:" ✕";color:var(--acc)}
.gold{position:fixed;z-index:5;font:inherit;font-size:20px;background:var(--acc);color:var(--ink);border:4px solid var(--ink);padding:10px 14px;cursor:pointer;text-transform:uppercase;transform:rotate(-6deg);animation:fall 8s linear forwards}
@keyframes fall{from{top:-60px}to{top:105vh}}

.ic svg,.wi svg,.coin svg,.gold svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7;width:100%;height:100%}
h1{animation:hin .9s cubic-bezier(.2,.9,.2,1)}
@keyframes hin{from{transform:translateX(-70px) skewX(-8deg);opacity:0}}
.win{flex-direction:column;gap:6px}
.win b{display:block}
.wi{position:relative;z-index:1;width:70px;height:70px}
.wi.drop{animation:drop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{0%{transform:translateY(-140px) rotate(-35deg);opacity:0}50%{opacity:1}100%{transform:none}}
.win b.in{animation:tx .4s cubic-bezier(.2,.9,.2,1)}
@keyframes tx{from{transform:translateX(-34px) skewX(-14deg);opacity:0}}
.coin{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.coin svg{width:28px;height:28px;stroke:var(--acc);stroke-width:2.2;position:relative;z-index:1}
.coin span{position:relative;z-index:1}
.coin::after{content:"";position:absolute;inset:0;background:var(--acc);transform:translateX(-101%) skewX(-20deg);transition:transform .25s}
.coin:hover::after{transform:translateX(0) skewX(-20deg)}
.coin:hover{color:var(--ink)}.coin:hover svg{stroke:var(--ink)}
.machine.press{animation:press .16s}
@keyframes press{50%{transform:rotate(-2.5deg) scale(.97,1.02)}}
.count{transform-origin:left bottom}
.count.bump{animation:bump .16s}
@keyframes bump{50%{transform:scale(1.05) skewX(-4deg)}}
.pop{position:fixed;z-index:6;pointer-events:none;font-size:26px;line-height:1;white-space:nowrap;color:var(--paper);background:var(--ink);padding:7px 22px 7px 28px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,12px 100%);animation:ban 1s cubic-bezier(.2,.8,.2,1) forwards}
.pop::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--acc);clip-path:polygon(0 0,100% 0,12px 100%,0 100%)}
.pop.big{font-size:46px;background:var(--acc);color:var(--ink);padding:10px 30px 10px 38px}
.pop.big::before{background:var(--ink)}
@keyframes ban{0%{transform:translate(-30px,12px) rotate(-8deg) scale(.4);opacity:0}15%{transform:rotate(-5deg) scale(1.12);opacity:1}30%{transform:rotate(-5deg) scale(1)}100%{transform:translate(24px,-100px) rotate(-5deg);opacity:0}}
.shard{position:fixed;z-index:5;width:5px;height:28px;background:var(--acc);pointer-events:none}
.item{position:relative;overflow:hidden;grid-template-columns:52px 1fr auto;transition:transform .15s}
.item::before{content:"";position:absolute;inset:0;background:var(--acc);transform:translateX(-101%) skewX(-20deg);transition:transform .3s;z-index:0}
.item>*{position:relative;z-index:1}
.item.can:hover::before{transform:translateX(0) skewX(-20deg)}
.item.can:hover{color:var(--ink);transform:translateX(6px)}
.item.can:hover .o{color:var(--ink)}
.item .ic{grid-column:1;grid-row:1/3;width:44px;height:44px;align-self:center}
.item .n{grid-column:2;grid-row:1}.item .o{grid-column:3;grid-row:1}
